name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  source-gates:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest

      - name: Python tests
        run: python -m pytest -q tests

      - name: .NET restore
        run: dotnet restore HyperBoostX.sln

      - name: .NET build
        run: dotnet build HyperBoostX.sln -c Release -v minimal

      - name: .NET tests
        run: dotnet test dotnet-tests/HyperBoostX.Tests/HyperBoostX.Tests.csproj -c Release -v minimal

      - name: Docs consistency
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify_docs_consistency.ps1

      - name: Public evidence redaction
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify_public_evidence_redaction.ps1

      - name: Action map contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify_action_map_contract.ps1

      - name: Backend route contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify_backend_routes.ps1
