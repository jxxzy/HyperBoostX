name: Release Gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest pyinstaller

      - name: Install NSIS
        run: choco install nsis -y

      - name: Run backend tests
        run: python -m pytest tests -q

      - name: Run .NET tests
        run: dotnet test dotnet-tests/HyperBoostX.Tests/HyperBoostX.Tests.csproj -c Release

      - name: Build release package
        shell: powershell
        run: .\scripts\build_release_ci.ps1

      - name: Upload gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hyperboostx-gate-artifacts
          path: |
            HyperBoostXInstaller.exe
            SHA256SUMS.txt
            release/backend/hyperboost_backend.exe
            release/launcher/HyperBoostLauncher.exe
            release/wpf/HyperBoostX.exe

  e2e-lab-gate:
    needs: build-release
    runs-on:
      - self-hosted
      - windows
      - hyperboostx-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gate artifacts
        uses: actions/download-artifact@v4
        with:
          name: hyperboostx-gate-artifacts
          path: build_tmp/gate-artifacts

      - name: Run installer gate
        shell: powershell
        run: >
          .\scripts\test_installer_update_e2e.ps1
          -InstallerPath ".\build_tmp\gate-artifacts\HyperBoostXInstaller.exe"
          -LaunchSeconds 12
